name: Build Invis Client

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Android NDK
      uses: android-actions/setup-android@v4
      with:
        ndk-version: '25.2.9519653'

    - name: Compile C++ Client Binary
      run: |
        cd jni || cd app/src/main/jni || cd .
        ndk-build
        
    - name: Upload Compiled Client Binary
      uses: actions/upload-artifact@v4
      with:
        name: Invis-Client-Beta
        path: libs/
        
